<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- SEO defaults. The build (vite.config.js → seoPages) rewrites these per
         route from src/content/seo.js; usePageMeta updates them in the browser. -->
    <title>ATS Score – Free ATS Resume Checker & Builder</title>
    <meta name="description" content="Free ATS resume checker and builder. Get an instant ATS score, see missing keywords from the job description, and export ATS-friendly PDF or DOCX resumes and cover letters." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ATS Score" />
    <meta property="og:title" content="ATS Score – Free ATS Resume Checker & Builder" />
    <meta property="og:description" content="Free ATS resume checker and builder. Get an instant ATS score, see missing keywords from the job description, and export ATS-friendly PDF or DOCX resumes and cover letters." />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ATS Score: free ATS resume checker and builder" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ATS Score – Free ATS Resume Checker & Builder" />
    <meta name="twitter:description" content="Free ATS resume checker and builder. Get an instant ATS score, see missing keywords from the job description, and export ATS-friendly PDF or DOCX resumes and cover letters." />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="theme-color" content="#16a34a" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "ATS Score",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any",
        "description": "Free ATS resume checker and builder with keyword matching, PDF/DOCX export and a cover letter builder.",
        "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}
      }
    </script>
    <script>
      // Apply the saved theme before first paint to avoid a light flash (see ThemeToggle.jsx).
      (function () {
        var choice = 'auto'
        try { choice = localStorage.getItem('ats.theme') || 'auto' } catch (e) {}
        var dark = choice === 'dark' || (choice === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <noscript>ATS Score needs JavaScript to check and build resumes. Please enable it in your browser.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
